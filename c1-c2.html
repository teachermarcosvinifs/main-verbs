<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verbos C1–C2</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="advanced-verbs.css" />
  <script src="advanced-verbs.js" defer></script>
</head>
<body class="advanced-page" data-tier="C1-C2">
  <div class="background-glow"></div>
  <main class="container">
    <section class="hero">
      <div class="hero-left">
        <div class="title-row"><h1>VERBOS</h1><span class="level-badge">C1–C2</span></div>
        <p class="subtitle">Uso geral, profissional e acadêmico</p>
      </div>
    </section>
    <section class="advanced-toolbar" aria-label="Filtros da lista">
      <div class="filter-group">
        <button class="filter-chip is-active" data-filter="all">Todos</button>
        <button class="filter-chip" data-filter="uso geral">Uso geral</button>
        <button class="filter-chip" data-filter="formal">Formal</button>
        <button class="filter-chip" data-filter="acadêmico">Acadêmico</button>
        <button class="filter-chip" data-filter="profissional">Profissional</button>
      </div>
      <input class="advanced-search" data-verb-search type="search" placeholder="Buscar verbo, significado ou exemplo" aria-label="Buscar verbo, significado ou exemplo" />
    </section>
    <section class="advanced-table">
      <div class="advanced-header"><span></span><span>Verbo</span><span>Passado</span><span>Particípio</span><span>Ouvir</span><span>Exemplo</span><span>Significado</span><span></span></div>
      <div data-verbs-list></div>
    </section>
  </main>
</body>
</html>
